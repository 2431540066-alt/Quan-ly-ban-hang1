services:
  db:
    image: postgres:16
    environment: { POSTGRES_PASSWORD: postgres, POSTGRES_DB: shop }
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U postgres"], interval: 3s, retries: 20 }
  forecast:
    build: ./forecast
    ports: ["8000:8000"]
  server:
    build: ./server
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/shop
      FORECAST_URL: http://forecast:8000
      JWT_SECRET: ${JWT_SECRET:-dev-only-change-me}
    depends_on: { db: { condition: service_healthy } }
    ports: ["4000:4000"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
  web:
    build: ./web
    environment: { API_TARGET: "http://server:4000" }
    depends_on: { server: { condition: service_healthy } }
    ports: ["5173:5173"]
volumes: { pgdata: {} }
